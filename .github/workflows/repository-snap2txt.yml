name: Repository Snap2Text

on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: snap2txt-${{ github.repository }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Build canonical project_contents.txt
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out pushed repository state
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install the verified Snap2Txt implementation
        run: >-
          python -m pip install --disable-pip-version-check
          "git+https://github.com/vorniches/snap2txt.git@970539bec15a27e7f562e8229c2fff6a6ef34d6e"

      - name: Convert the repository into one text dossier
        shell: bash
        run: |
          set -Eeuo pipefail
          snap2txt
          test -s project_contents.txt
          cp project_contents.txt "$RUNNER_TEMP/project_contents.txt"

          bytes="$(stat -c '%s' "$RUNNER_TEMP/project_contents.txt")"
          digest="$(sha256sum "$RUNNER_TEMP/project_contents.txt" | cut -d' ' -f1)"
          {
            echo "### Snap2Text dossier"
            echo
            echo "- Repository: \`$GITHUB_REPOSITORY\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            echo "- Bytes: \`$bytes\`"
            echo "- SHA-256: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the canonical file as a rolling release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SNAP_RELEASE: snap2txt-latest
        run: |
          set -Eeuo pipefail

          snapshot="$RUNNER_TEMP/project_contents.txt"
          notes="$RUNNER_TEMP/snap2txt-release-notes.md"
          bytes="$(stat -c '%s' "$snapshot")"
          digest="$(sha256sum "$snapshot" | cut -d' ' -f1)"

          cat > "$notes" <<EOF
          Canonical one-file Snap2Text dossier for **$GITHUB_REPOSITORY**.

          - Source commit: \`$GITHUB_SHA\`
          - Source ref: \`$GITHUB_REF\`
          - Size: \`$bytes bytes\`
          - SHA-256: \`$digest\`
          EOF

          if gh release view "$SNAP_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$SNAP_RELEASE" "$snapshot" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$SNAP_RELEASE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Latest Snap2Text dossier" \
              --notes-file "$notes"
          else
            gh release create "$SNAP_RELEASE" "$snapshot" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Latest Snap2Text dossier" \
              --notes-file "$notes"
          fi

      - name: Publish the dossier to the snap2txt branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SNAP_BRANCH: snap2txt
        run: |
          set -Eeuo pipefail

          snapshot="$RUNNER_TEMP/project_contents.txt"
          bytes="$(stat -c '%s' "$snapshot")"
          max_git_blob_bytes=$((95 * 1024 * 1024))

          if (( bytes > max_git_blob_bytes )); then
            echo "Snapshot is too large for a normal Git blob; the release asset remains canonical."
            exit 0
          fi

          archive="$RUNNER_TEMP/snap2txt-branch"
          repository_url="${{ github.server_url }}/${{ github.repository }}.git"

          mkdir -p "$archive"
          cd "$archive"
          git init
          git remote add origin "$repository_url"
          gh auth setup-git

          if git ls-remote --exit-code --heads origin "$SNAP_BRANCH" >/dev/null 2>&1; then
            git fetch --depth=1 origin "$SNAP_BRANCH"
            git checkout -B "$SNAP_BRANCH" FETCH_HEAD
          else
            git checkout --orphan "$SNAP_BRANCH"
          fi

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$snapshot" project_contents.txt

          git config user.name "overandor-snap2txt[bot]"
          git config user.email "overandor-snap2txt[bot]@users.noreply.github.com"
          git add -- project_contents.txt

          if git diff --cached --quiet; then
            echo "Snapshot is unchanged; no branch commit required."
            exit 0
          fi

          git commit -m "snapshot: $GITHUB_REPOSITORY@$GITHUB_SHA"
          git push origin "HEAD:$SNAP_BRANCH"
